{% extends "base.html" %}

{% block title %}Create Account | YAMORA Retails Tech Store{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="bg-dark text-white p-4 text-center">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="YAMORA Retails Logo" class="rounded-3 mb-2 shadow-sm border border-info border-opacity-50" style="height: 60px; width: 60px; object-fit: cover;">
                    <h4 class="fw-bold mb-1">Create an Account</h4>
                    <p class="small text-muted mb-0">Join YAMORA Retails for exclusive deals and order tracking</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('auth.register') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name *</label>
                            <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address *</label>
                            <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" name="phone" class="form-control" placeholder="+1 555-019-2834">
                        </div>
                        <div class="row g-2 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Password *</label>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required minlength="6">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Confirm Password *</label>
                                <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required minlength="6">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-3 fw-bold text-uppercase">Create Account</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">Already registered? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Sign in here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
